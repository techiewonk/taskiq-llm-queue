# ElasticMQ for the scenario harness (compose service sqs-scn). No queues are pre-declared:
# the harness creates its own (with DLQs) at runtime. host "*" makes queue URLs follow the
# Host header, so the same URLs work from the host (localhost:19324) and from containers.
include classpath("application.conf")
node-address { protocol = http, host = "*", port = 19324, context-path = "" }
rest-sqs { enabled = true, bind-port = 19324, bind-hostname = "0.0.0.0", sqs-limits = strict }
rest-stats { enabled = false }
queues {}

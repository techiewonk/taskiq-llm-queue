# Local test stack for taskiq-llm-queue. All config is in this file (no .env needed).
# Start:  python scripts/stack.py up      (docker compose -f docker/compose.yaml up -d --wait)
# Stop:   python scripts/stack.py down
#
# Valkey and Redis (every store test runs on both) and fakellm (fake Bedrock / OpenAI). Queues
# are Valkey streams in the same store; there is no separate queue service.
name: llmq-test

services:
  valkey:
    # Prod runs Valkey 8.x on ElastiCache; password required, TLS off locally (the app's VALKEY_SSL=false).
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--requirepass", "localdev", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "localdev", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    # Redis 7.4 next to Valkey: every store test runs on both engines (plan E8). Port 6380.
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "localdev", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "localdev", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  fakellm:
    # Fake Bedrock (Converse, InvokeModel) + OpenAI (chat, embeddings); admin API on the same port.
    # Pick a scenario with SCENARIO=<name> (file tools/fakellm/scenarios/<name>.yaml).
    build: {context: ../tools/fakellm, dockerfile: ../../docker/fakellm.Dockerfile}
    environment:
      FAKELLM_SCENARIO: /scenarios/${SCENARIO:-default}.yaml
      FAKELLM_SEED: ${FAKELLM_SEED:-42}
    volumes: ["../tools/fakellm/scenarios:/scenarios:ro"]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15

# Fake SQS for local tests (ElasticMQ). Queue names and settings mirror a production setup (see docs/DESIGN.md).
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  "llm-gpt120b-rt" {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "llm-gpt120b-rt-dlq", maxReceiveCount = 10 }
  }
  "llm-gpt120b" {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "llm-gpt120b-dlq", maxReceiveCount = 10 }
  }
  "llm-gpt20b-rt" {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "llm-gpt20b-rt-dlq", maxReceiveCount = 10 }
  }
  "llm-gpt20b" {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "llm-gpt20b-dlq", maxReceiveCount = 10 }
  }
  "llm-embed-rt" {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "llm-embed-rt-dlq", maxReceiveCount = 10 }
  }
  "llm-embed" {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "llm-embed-dlq", maxReceiveCount = 10 }
  }
  "llm-embed-bulk" {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "llm-embed-bulk-dlq", maxReceiveCount = 10 }
  }
  "jobs-ingest" {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "jobs-ingest-dlq", maxReceiveCount = 5 }
  }
  "jobs-followup" {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "jobs-followup-dlq", maxReceiveCount = 5 }
  }
  "jobs-nudge" {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "jobs-nudge-dlq", maxReceiveCount = 5 }
  }

  # Dead-letter queues
  "llm-gpt120b-rt-dlq" {}
  "llm-gpt120b-dlq" {}
  "llm-gpt20b-rt-dlq" {}
  "llm-gpt20b-dlq" {}
  "llm-embed-rt-dlq" {}
  "llm-embed-dlq" {}
  "llm-embed-bulk-dlq" {}
  "jobs-ingest-dlq" {}
  "jobs-followup-dlq" {}
  "jobs-nudge-dlq" {}

  # Test-only queues
  "llm-dup-test" {
    defaultVisibilityTimeout = 2 seconds
    receiveMessageWait = 1 second
  }
  "parity-fifo.fifo" {
    fifo = true
    contentBasedDeduplication = true
  }
}

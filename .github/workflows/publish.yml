# Build once, then publish with PyPI trusted publishing (OIDC): no API token is stored anywhere.
# - Manual run ("Run workflow")  -> TestPyPI
# - Publishing a GitHub release  -> PyPI
# One-time setup on (test.)pypi.org: add a trusted publisher for this repo, workflow
# `publish.yml`, environment `testpypi` / `pypi`.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Never publish a tree that fails lint, types or tests.

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv build --no-sources
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

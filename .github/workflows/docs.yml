# Docs site (Zensical) on GitHub Pages.
# Every pull request builds it with --strict (a broken link fails). A published GitHub
# release, or a manual run (Actions > Docs > Run workflow, any branch), deploys it.
# One-time owner setup: Settings > Pages > Source: GitHub Actions; and in Settings >
# Environments > github-pages, allow the branch or tags that deploy.
name: Docs

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      # Pinned: Zensical is 0.x, its config and plugins may change between versions.
      - run: uvx --with "mkdocstrings-python==2.0.11" "zensical==0.1.1" build --clean --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment

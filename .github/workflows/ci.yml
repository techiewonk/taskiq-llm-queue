# Lint, type-check and test on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reused by publish.yml so a release always runs the full checks

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest tests/unit -q

  lowest:
    # Oldest versions the ranges in pyproject allow: catches floors that are wrong in practice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --all-extras --resolution lowest-direct
      - run: uv run pytest tests/unit -q

  langchain-1x:
    # The dev lock pins the LangChain 0.3 line; the extras also allow 1.x, so test the adapters there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: >-
          uv pip install "langchain-core>=1,<2" "langchain-aws>=1,<2"
          "langchain-openai>=1,<2" "langgraph>=1" "openai>=2,<4"
      - run: uv run --no-sync pytest tests/unit/lc -q

  integration:
    # Valkey 8.1, ElasticMQ 1.7.1 and fakellm from docker/compose.yaml (same stack as local).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: docker compose -f docker/compose.yaml up -d --wait
      - run: uv run pytest tests/unit tests/integration -q
      - if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color
      - if: always()
        run: docker compose -f docker/compose.yaml down

[project]
site_name = "taskiq-llm-queue"
site_description = "LLM calls through a queue on Valkey or Redis, under RPM/TPM budgets"
site_url = "https://techiewonk.github.io/taskiq-llm-queue/"
repo_url = "https://github.com/techiewonk/taskiq-llm-queue"
repo_name = "techiewonk/taskiq-llm-queue"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Architecture" = "ARCHITECTURE.md" },
  { "Samples" = "samples.md" },
  { "API reference" = "api.md" },
  { "Changelog" = "changelog.md" },
  { "Stability" = "stability.md" },
  { "Contributing" = "contributing.md" },
]

# Internal planning docs: never published.
exclude_docs = """
ACCOUNT_ROUTING_PLAN.md
ACCOUNT_ROUTING_WALKTHROUGH.md
RELEASE_PLAN_0.3.0.md
TEST_AND_FIX_PLAN.md
RELEASING.md
"""

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "navigation.instant",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
members_order = "source"
filters = ["!^_"]
show_signature_annotations = true
separate_signature = true
merge_init_into_class = true

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
